on:
  pull_request:
    types: [opened, synchronize, closed, reopened]
    branches:
      - live

  push:
    branches:
      - live

  # Sent by rdn-projectbase after a project is added, updated or removed.
  repository_dispatch:
    types: [projectbase-updated]

  # "Run workflow" button on the Actions tab.
  workflow_dispatch:

  # Safety net in case a dispatch is missed: rebuild once a day (03:17 UTC).
  schedule:
    - cron: "17 3 * * *"

name: Quarto Publish

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  build-deploy:
    if: |
      !contains(github.event.commits[0].message, '[skip-ci]') ||
      (github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The pre-render script copies the project register from rdn-projectbase.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages for the project register
        run: pip install pyyaml "jsonschema[format]>=4.18"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      #
      # - name: Install dependencies
      #   uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     packages:
      #       any::data.table
      #       any::kableExtra
      #       any::knitr
      #       any::Require
      #       any::rmarkdown

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RDN_PROJECTBASE_CLONE: "1"
